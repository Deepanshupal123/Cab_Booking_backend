services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - cab_mongo_data:/data/db

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/cab-booking
      JWT_SECRET: change_me_in_real_deployments
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: "*"
    depends_on:
      - mongo

volumes:
  cab_mongo_data:
